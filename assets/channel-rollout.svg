    <text x="365" y="616" text-anchor="middle" font-size="14" fill="#B4B4AC">1</text>
    <text x="435" y="616" text-anchor="middle" font-size="14" fill="#B4B4AC">2</text>
    <text x="505" y="616" text-anchor="middle" font-size="14" fill="#B4B4AC">3</text>
    <text x="575" y="616" text-anchor="middle" font-size="14" fill="#B4B4AC">4</text>
