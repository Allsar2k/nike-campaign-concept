<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
  <title id="t">Show Up channel rollout over 12 weeks</title>
  <desc id="d">Gantt chart. Seed phase weeks 1 to 4, launch weeks 5 to 6, sustain weeks 7 to 12. Run club partnerships run weeks 1 to 12. Creators and athletes weeks 3 to 12. Hero film and social video weeks 5 to 8, launching in week 5. Nike Run Club app weeks 5 to 12. Strava challenge weeks 5 to 12. Store group runs weeks 6 to 12.</desc>
  <rect width="1200" height="640" fill="#0B0B0C"/>
  <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
    <text x="60" y="64" font-size="15" font-weight="700" letter-spacing="3" fill="#D4FF3A">CHANNEL-BY-CHANNEL ROLLOUT</text>
    <text x="60" y="108" font-family="'Arial Narrow', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" font-style="italic" fill="#F7F7F2">TWELVE WEEKS, ONE HABIT</text>
    <!-- phases -->
    <rect x="330" y="140" width="280" height="40" fill="#18181B"/><text x="346" y="166" font-size="15" font-weight="700" letter-spacing="2" fill="#B4B4AC">SEED · WK 1–4</text>
    <rect x="610" y="140" width="140" height="40" fill="#FF6A2B"/><text x="626" y="166" font-size="15" font-weight="700" letter-spacing="1" fill="#0B0B0C">LAUNCH 5–6</text>
    <rect x="750" y="140" width="420" height="40" fill="#18181B"/><text x="766" y="166" font-size="15" font-weight="700" letter-spacing="2" fill="#B4B4AC">SUSTAIN · WK 7–12</text>
    <line x1="330" y1="196" x2="330" y2="590" stroke="#2E2E33" stroke-width="1"/>
    <line x1="400" y1="196" x2="400" y2="590" stroke="#2E2E33" stroke-width="1"/>
    <line x1="470" y1="196" x2="470" y2="590" stroke="#2E2E33" stroke-width="1"/>
    <line x1="540" y1="196" x2="540" y2="590" stroke="#2E2E33" stroke-width="1"/>
    <line x1="610" y1="196" x2="610" y2="590" stroke="#2E2E33" stroke-width="1"/>
    <line x1="680" y1="196" x2="680" y2="590" stroke="#2E2E33" stroke-width="1"/>
    <line x1="750" y1="196" x2="750" y2="590" stroke="#2E2E33" stroke-width="1"/>
    <line x1="820" y1="196" x2="820" y2="590" stroke="#2E2E33" stroke-width="1"/>
